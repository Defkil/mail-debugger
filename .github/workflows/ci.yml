name: CI

on:
  push:
    branches:
      - main
      - feat/claude-d8f0/mail-debugger
  pull_request:

permissions: {}

# A newer push to the same branch supersedes a running check, except on main,
# where every commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NX_NO_CLOUD: 'true'

jobs:
  verify:
    name: Verify (Node 24)
    # Pinned instead of ubuntu-latest, which moves to Ubuntu 26.04 from
    # 2026-10-19; publish.yml uses the same image. See docs/release.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned in package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # The npm of the publish job, which the smoke test uses to pack and
      # install the tarballs.
      - run: npm install --global npm@12.2.0

      - run: pnpm install --frozen-lockfile

      # Formatting, lint, typecheck, unit tests, builds, end-to-end tests,
      # the installed-tarball smoke test and the production audit, exactly
      # as the publish workflow runs them.
      - run: pnpm verify

  runtime:
    name: Runtime (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The engines floor: only the installed packages, as users run them.
          - node: 22.17.0
            e2e: false
          # Maintained and current releases; Node 24 runs in the verify job.
          - node: '22'
            e2e: true
          - node: '26'
            e2e: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      # Install, build and pack with the contributor runtime...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack the three distributions
        run: node scripts/pack-and-smoke.mjs --pack-only
        env:
          MAIL_DEBUGGER_PACK_DIR: ${{ runner.temp }}/tarballs

      # ...then run the servers, clients and installed packages on the
      # runtime under test.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - run: node --version && npm --version

      - name: End-to-end tests
        if: matrix.e2e
        working-directory: apps/server-e2e
        run: pnpm exec vitest run

      - name: Install and run the packed tarballs
        run: node scripts/pack-and-smoke.mjs --tarballs "$RUNNER_TEMP/tarballs"
