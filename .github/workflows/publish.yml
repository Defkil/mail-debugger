name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Installs the pnpm version pinned in package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint
      - run: pnpm exec nx run client:lint
      - run: pnpm exec nx run "@mail-debugger/server:lint"
      - run: pnpm exec nx run "@mail-debugger/cli:lint"

      # Build dependencies — web:build (triggered by server:build via copy-web)
      # depends on the client lib but does not declare ^build. Cache-enabled so the
      # test dependency graph can reuse the result instead of re-triggering the
      # TypeScript sync generator, which hangs on CI runners.
      - run: pnpm exec nx run client:build

      # Build publishable artifacts
      - run: pnpm exec nx run "@mail-debugger/server:build" --skip-nx-cache
      - run: pnpm exec nx run "@mail-debugger/cli:build" --skip-nx-cache
      - run: pnpm exec nx run mail-debugger-api:build --skip-nx-cache
      - run: pnpm exec nx run mail-debugger-cli:build --skip-nx-cache

      # Test
      - run: pnpm exec nx run client:test
      - run: pnpm exec nx run "@mail-debugger/server:test"
      - run: pnpm exec nx run "@mail-debugger/cli:test"
      - run: pnpm exec nx run mail-debugger-api:test
      - run: pnpm exec nx run mail-debugger-cli:test

      # Typecheck
      - run: pnpm exec nx run client:typecheck
      - run: pnpm exec nx run "@mail-debugger/server:typecheck"
      - run: pnpm exec nx run "@mail-debugger/cli:typecheck"

      - name: Publish mail-debugger
        run: npm publish

      - name: Publish mail-debugger-api
        run: npm publish
        working-directory: packages/api

      - name: Publish mail-debugger-cli
        run: npm publish
        working-directory: packages/cli
