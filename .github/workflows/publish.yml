name: Publish to npm

# npm trusted publishing (OIDC) is configured for this workflow file name and
# repository for mail-debugger, mail-debugger-api and mail-debugger-cli.
# Renaming the file or adding a GitHub environment needs the trusted
# publisher settings on npm to change first. See docs/release.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish again, for example v0.4.0
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance; no token secret
    # One release at a time; a running release is never cancelled.
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_TUI: 'false'
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check the trigger and the tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT" == workflow_dispatch && "$REF" != refs/heads/main ]]; then
            echo "::error::Dispatch this workflow from main, not $REF"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$RELEASE_TAG is not a stable vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      # Installs the pnpm version pinned in package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      # No registry-url: npm authenticates through OIDC, not an .npmrc token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the tag against main, the versions and the changelog
        run: node scripts/verify-release.mjs "$RELEASE_TAG"

      - name: Install the publishing npm
        run: npm install --global npm@12.2.0

      - run: pnpm install --frozen-lockfile

      # Every gate of the CI verify job; the smoke test packs the tarballs
      # into MAIL_DEBUGGER_PACK_DIR and tests exactly those files.
      - run: pnpm verify
        env:
          MAIL_DEBUGGER_PACK_DIR: ${{ runner.temp }}/release

      - name: Publish the tested tarballs
        run: node scripts/publish-tarballs.mjs "$RUNNER_TEMP/release"
