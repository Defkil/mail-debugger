name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please use made-up addresses and content, and replace secrets with `***`: never paste real mail, passwords or tokens. Security vulnerabilities belong in a private report (see SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `mail-debugger --version` (or of `mail-debugger-api` or `mail-debugger-cli`).
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      options:
        - mail-debugger
        - mail-debugger-api
        - mail-debugger-cli
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v24.15.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and CPU
      description: For example Windows 11 on ARM64, macOS 15 on Apple silicon, Ubuntu 24.04 on x64, Alpine Linux in Docker.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Command line and configuration
      description: The command you ran and the `MAIL_DEBUGGER_*` variables you set, with secrets replaced by `***`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest steps or script that show the problem, for example the Nodemailer call, client code or IMAP or MCP client you used.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, including error messages and the relevant server log lines.
      render: text
    validations:
      required: true
