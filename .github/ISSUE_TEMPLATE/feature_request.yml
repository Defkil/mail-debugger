name: Feature request
description: Suggest an improvement for a development or testing workflow
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: How would you use the change in development or tests? Which part is involved (SMTP, web inbox, REST API, client, terminal client, IMAP, MCP)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Optional. How it could work, and what you considered instead.
